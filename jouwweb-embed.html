<div style="width:100%;max-width:1400px;margin:0 auto;">
  <iframe
    id="zamexcards-series"
    src="https://JOUW-GITHUB-NAAM.github.io/JOUW-REPOSITORY/"
    title="Pokémon TCG series en losse kaarten bij ZamexCards"
    loading="lazy"
    style="display:block;width:100%;height:1600px;border:0;border-radius:16px;overflow:hidden;"
  ></iframe>
</div>
<script>
  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'zamexcards-series-height') return;
    var frame = document.getElementById('zamexcards-series');
    if (frame) frame.style.height = Math.max(700, event.data.height + 12) + 'px';
  });
</script>
