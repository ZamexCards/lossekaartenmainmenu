    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;font-family:Montserrat,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 0,#0a3157 0,#041d39 32%,#02152d 100%)}

    .brand-name{margin:0;font-size:clamp(25px,4vw,36px);font-weight:900;line-height:1}.brand-name .z{color:var(--green)}.brand-name .c{color:var(--blue2)}

    .top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:22px 0 25px}
    h1{font-family:"Arial Narrow",Impact,sans-serif;letter-spacing:.4px;font-size:clamp(31px,5vw,54px);line-height:1;margin:0 0 10px}
    .lead{margin:0;color:var(--muted);font-size:16px;line-height:1.6;max-width:720px}
    .grid{display:flex;flex-direction:column;gap:12px}
    .tile{position:relative;isolation:isolate;display:flex;min-height:126px;overflow:hidden;text-align:left;border:1px solid #2c8c47;border-radius:16px;background:linear-gradient(115deg,#0d3a68 0%,#0a315c 38%,#08294e 72%,#071f3f 100%);background-size:180% 100%;background-position:0 0;box-shadow:0 14px 34px rgba(0,0,0,.22),inset 0 1px 0 rgba(85,169,255,.10);color:inherit;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background-position .5s ease}
    .tile:before,.set-card:before{content:"";position:absolute;z-index:0;inset:-6%;pointer-events:none;background:linear-gradient(90deg,rgba(3,26,53,.08),rgba(3,26,53,.38)),url('Z_Zamex_bezig.png') center 22%/67% auto no-repeat;opacity:.62;filter:blur(2.2px);transform:scale(1.04);transition:opacity .38s ease,transform .65s cubic-bezier(.2,.7,.2,1),background-position .65s ease}
    .tile>.art,.tile>.body,.set-card>.logo-box,.set-card>.set-body{position:relative;z-index:1}
    a.tile{width:100%;text-decoration:none;cursor:pointer}
    button.tile{width:100%;cursor:pointer;padding:0}
    .tile:hover{transform:translateY(-3px);background-position:100% 0;border-color:#55d764;box-shadow:0 20px 46px rgba(0,0,0,.32),0 0 0 1px rgba(85,215,100,.18),0 0 24px rgba(45,140,255,.13)}
    .tile:hover:before,.set-card:hover:before{opacity:.82;transform:scale(1.09);background-position:center 27%}
    .tile:hover .go{background:linear-gradient(135deg,rgba(68,211,91,.22),rgba(45,140,255,.18));box-shadow:0 0 18px rgba(68,211,91,.10)}
    .art{position:relative;flex:0 0 220px;min-height:124px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 48% 52%,rgba(85,169,255,.32),transparent 60%),linear-gradient(135deg,rgba(17,74,123,.72),rgba(9,43,80,.68))}
    .art:after{content:"";position:absolute;inset:0 0 0 auto;width:45px;background:linear-gradient(90deg,transparent,rgba(5,25,52,.98))}
    .art img{position:relative;z-index:1;width:72%;max-height:88px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
    .group-mark{position:relative;z-index:1;display:grid;place-items:center;width:132px;height:92px;border:2px solid rgba(85,215,100,.75);border-radius:20px;background:linear-gradient(145deg,#0a294e,#071f3f);box-shadow:0 12px 28px rgba(0,0,0,.32);font-size:31px;font-weight:900;color:var(--green)}

    .art img.flag-logo{width:132px;height:88px;object-fit:cover;border:2px solid rgba(255,255,255,.72);border-radius:13px;box-shadow:0 12px 28px rgba(0,0,0,.38)}
    .promo-mark{position:relative;z-index:1;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}

    .promo-mark b{position:absolute;top:39px;padding:2px 6px;background:#fff;color:#05080c;font-size:13px;letter-spacing:1px;transform:rotate(-8deg)}

    .date-info{color:#dbeaff;font-size:14px;font-weight:700}
    .meta{color:var(--muted);font-size:13px}
    .go{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:rgba(85,215,100,.1);color:var(--green);font-weight:800;font-size:14px}
    .arrow{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(85,215,100,.12);font-size:18px}
    .crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin:22px 0}
    .crumbs button{padding:0;border:0;background:none;color:var(--blue2);cursor:pointer}
    .sets-grid{display:flex;flex-direction:column;gap:12px}
    .set-card{position:relative;isolation:isolate;display:flex;min-height:126px;padding:0;overflow:hidden;border:1px solid #31587b;border-radius:15px;background:linear-gradient(115deg,#0c3763 0%,#0a3159 42%,#082749 76%,#071f3f 100%);background-size:180% 100%;background-position:0 0;box-shadow:0 14px 34px rgba(0,0,0,.22),inset 0 1px 0 rgba(85,169,255,.09);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background-position .5s ease}

    .code-art{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:138px;height:86px;overflow:hidden;border:2px solid rgba(85,169,255,.78);border-radius:18px;background:radial-gradient(circle at 22% 20%,rgba(68,211,91,.34),transparent 38%),linear-gradient(145deg,#0d3d68,#071f3f 70%);color:var(--green);box-shadow:0 10px 24px rgba(0,0,0,.32),inset 0 0 22px rgba(45,140,255,.12)}

    .set-body{display:grid;grid-template-columns:minmax(250px,1.5fr) minmax(150px,.8fr) 190px;align-items:center;gap:18px;flex:1;padding:18px 20px}
    .set-name{min-width:0}.set-body h2{font-size:18px;margin:6px 0 0}
    .code{display:inline-flex;width:max-content;padding:4px 7px;border-radius:6px;background:rgba(45,140,255,.15);color:#8fc3ff;font-size:12px;font-weight:800}
    .shop{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:linear-gradient(135deg,#55d764,#36af4c);color:#041b14;text-decoration:none;font-size:14px;font-weight:900;cursor:pointer}
    .shop:hover{filter:brightness(1.08)}
    .back{border:1px solid var(--line);border-radius:10px;background:#082747;color:#fff;padding:10px 13px;cursor:pointer}
    .set-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
    .set-head h1{font-size:clamp(29px,4vw,45px)}
    .hidden{display:none!important}
    .shop[aria-disabled="true"]{background:#173451;color:#a9bfd2;cursor:not-allowed}
    @media(prefers-reduced-motion:reduce){.tile,.set-card,.tile:before,.set-card:before{transition:none}.tile:hover,.set-card:hover{transform:none}}
    @media(max-width:900px){.body{grid-template-columns:minmax(180px,1.2fr) minmax(145px,1fr) 145px}.body .date-info{display:none}.set-body{grid-template-columns:minmax(210px,1fr) 135px 175px}.art,.logo-box{flex-basis:185px}}
    @media(max-width:650px){.shell{width:min(100% - 22px,1180px);padding-top:14px}.brandbar{gap:12px;padding:10px 12px;margin-bottom:18px}.brand-logo{width:72px;height:72px}.brand-sub{font-size:13px}.top,.set-head{align-items:stretch;flex-direction:column}.grid,.sets-grid{gap:11px}.tile,.set-card{display:grid;grid-template-columns:104px minmax(0,1fr);min-height:146px}.art,.logo-box{width:104px;min-height:146px;padding:12px;overflow:hidden}.art img{width:92%;max-height:72px}.art img.flag-logo{width:76px;height:52px}.promo-mark{transform:scale(.72)}.body,.set-body{display:flex;align-items:stretch;justify-content:center;flex-direction:column;gap:7px;padding:13px}.body h2,.set-body h2{font-size:16px}.body .date-info{display:block;font-size:12px}.meta{font-size:12px}.go,.shop{margin-top:5px;font-size:12px;padding:9px 10px}.logo-box img{max-height:72px}.code-art{width:78px;height:58px}.code-art small{font-size:6px;letter-spacing:.8px}.code-art b{font-size:18px}.promo-logo img{max-width:95%}.promo-logo strong{font-size:11px;padding:2px 7px}}
  </style>
</head>

    const monthNumbers={januari:0,februari:1,maart:2,april:3,mei:4,juni:5,juli:6,augustus:7,september:8,oktober:9,november:10,december:11};
    function parseDate(value){if(!value)return null;const v=value.trim();let m;if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));if((m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/)))return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));const p=v.toLowerCase().split(/\s+/);return p.length===3&&monthNumbers[p[1]]!==undefined?new Date(Number(p[2]),monthNumbers[p[1]],Number(p[0])):null}
    function dateValue(value){const d=parseDate(value);return d&&!Number.isNaN(d.getTime())?d.getTime():0}
    function formatDate(value){const d=parseDate(value);return !d||Number.isNaN(d.getTime())?value:new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'long',year:'numeric'}).format(d)}
    function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(rows.length<2)return[];const headers=rows.shift().map(h=>h.trim().toLowerCase());return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,(values[i]||'').trim()]))) }
    async function loadSheet(){const url=window.ZAMEX_CONFIG&&window.ZAMEX_CONFIG.sheetCsvUrl;if(!url)return;const yes=v=>String(v).trim().toLowerCase()==='true',enabled=v=>String(v).trim().toLowerCase()!=='false';try{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('Sheet niet bereikbaar');const rows=parseCsv(await response.text());const seriesRows=rows.filter(r=>r.type.toLowerCase()==='series'&&r.id&&r.name);const setRows=rows.filter(r=>r.type.toLowerCase()==='set'&&r.parent&&r.name);if(!seriesRows.length||!setRows.length)throw new Error('Geen geldige regels');featuredSeries=seriesRows.filter(r=>yes(r.featured)).map(r=>({id:r.id,name:r.name,years:r.period||'',releaseDate:r.release_date||'',logo:r.logo||null,directUrl:r.direct_url||'',flag:r.flag||'',promo:yes(r.promo_logo),enabled:enabled(r.active)}));normalSeries=seriesRows.filter(r=>!yes(r.featured)).map(r=>({id:r.id,name:r.name,years:r.period||'',releaseDate:r.release_date||'',logo:r.logo||null,enabled:enabled(r.active)}));sets={};setRows.forEach(r=>{const code=r.code||'',localLogo=localLogos[code.toLowerCase()]||'';(sets[r.parent]||(sets[r.parent]=[])).push({name:r.name,code,date:formatDate(r.release_date),logo:localLogo||r.logo||null,url:r.url||'',promoLogo:yes(r.promo_logo),active:enabled(r.active)})})}catch(error){console.warn('Google Sheet kon niet worden geladen; de ingebouwde gegevens worden gebruikt.')}}

    function safeImg(img){img.onerror=()=>img.replaceWith(makeBadge(img.dataset.fallback||'SET'))}
    function renderSeries(){
      seriesGrid.innerHTML=series.map(s=>{const a=(sets[s.id]||[]).filter(x=>x.active!==false);let visual;if(s.promo)visual='<div class="promo-mark" aria-label="Black Star Promo"><span>★</span><b>PROMO</b></div>';else if(s.flag)visual=`<img class="flag-logo" data-fallback="${s.id.toUpperCase()}" alt="Vlag bij ${s.name}" src="${s.flag}">`;else visual=`<img data-fallback="${s.id.toUpperCase()}" alt="Logo ${s.name}" src="${s.logo}">`;const content=`<div class="art">${visual}</div><div class="body"><h2>${s.name}</h2><div class="meta">${s.directUrl?'Alle beschikbare PSA graded kaarten':`${a.length} ${a.length===1?'actieve set':'actieve sets'}`}</div><div class="date-info">${s.years}</div><div class="go"><span>${s.directUrl?'Bekijk graded kaarten':'Bekijk sets'}</span><span class="arrow">→</span></div></div>`;return s.directUrl?`<a class="tile" href="${s.directUrl}" target="_top" aria-label="Bekijk ${s.name}">${content}</a>`:`<button class="tile" data-series="${s.id}" aria-label="Bekijk ${s.name}">${content}</button>`}).join('');

      const s=series.find(x=>x.id===id),items=(sets[id]||[]).filter(x=>x.active!==false).slice().sort((a,b)=>dateValue(b.date)-dateValue(a.date));

      document.querySelectorAll('.logo-box img').forEach(safeImg);
      location.hash=id;scrollTo({top:0,behavior:'smooth'});
    }
    function allSeries(){document.querySelector('#setsView').classList.add('hidden');document.querySelector('#seriesView').classList.remove('hidden');history.replaceState(null,'',location.pathname);scrollTo({top:0,behavior:'smooth'})}
    document.querySelector('#backButton').onclick=allSeries;document.querySelector('#crumbBack').onclick=allSeries;
